<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey — проверка реализации</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e9e7;color:#20272f;font:14px/1.4 system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:white}select,button{font:inherit;padding:8px;min-height:40px}main{display:flex;justify-content:center;padding:12px;overflow:auto}#stage{position:relative}iframe{border:0;background:white;transform-origin:top left;position:absolute;top:0;left:0}label{display:flex;gap:8px;align-items:center}#progress{width:180px}</style><header><strong>Journey · проверка</strong><label>Экран <select id="size"><option>1440×900</option><option>1366×768</option><option>1280×720</option><option>1920×1080</option><option>1024×768</option><option>390×844</option><option>320×720</option></select></label><label>Прокрутка <input id="progress" type="range" min="0" max="1000" value="0"></label><button id="start">Начало</button><button id="end">Конец</button><output id="status"></output></header><main><div id="stage"><iframe title="Twin — рабочая версия" src="index.html?v=6e8f294#journey-variant-4"></iframe></div></main><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size'),stage=document.querySelector('#stage'),range=document.querySelector('#progress'),status=document.querySelector('#status');
function resize(){const[w,h]=size.value.split('×').map(Number),s=Math.min(1,(innerWidth-24)/w,(innerHeight-100)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${s})`;stage.style.width=w*s+'px';stage.style.height=h*s+'px';status.value=size.value;}
function scroll(p){const w=frame.contentWindow,n=w.document.querySelector('.story-journey'),panel=n?.querySelector('.story-panel');if(!n||!panel)return;w.scrollTo({top:n.getBoundingClientRect().top+w.scrollY+(n.offsetHeight-panel.offsetHeight)*p,behavior:'instant'});}
size.onchange=resize;range.oninput=()=>scroll(Number(range.value)/1000);document.querySelector('#start').onclick=()=>{range.value=0;scroll(0)};document.querySelector('#end').onclick=()=>{range.value=1000;scroll(1)};onresize=resize;resize();
</script></html>
