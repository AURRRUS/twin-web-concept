@font-face{font-family:ReviewSans;src:url('review-sans.ttf')}*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#25292b;font:16px ReviewSans,Arial,sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #805a35;outline-offset:4px}h1{font-size:44px;line-height:1.15;margin:0 0 16px;letter-spacing:-1.5px}h2{font-size:30px;margin:0 0 16px;letter-spacing:-.6px}p{line-height:1.55}header{display:flex;align-items:center;justify-content:space-between;padding:20px 52px;border-bottom:1px solid #ddd}header img{width:170px;max-height:80px;object-fit:contain}header small{color:#6c706e}.nav{display:flex;gap:12px;padding:22px 52px;flex-wrap:wrap}.nav a{color:#333;text-decoration:none;border-bottom:1px solid #b69a7b;padding:8px}.wrap{padding:38px 52px;max-width:1440px;margin:auto}.muted{color:#636a6d}.btn{background:#805a35;color:white;border:1px solid #805a35;padding:16px 24px;border-radius:8px}.btn.secondary{background:white;color:#303536;border-color:#d0d5d2}.btn:disabled{background:#dedfdc;border-color:#dedfdc;color:#555;cursor:default}.btn:hover:not(:disabled){filter:brightness(.94)}.tabs{display:flex;gap:0;border:1px solid #d7dbd6;border-radius:8px;overflow:auto;width:max-content;max-width:100%;margin:24px 0}.tabs button{white-space:nowrap;background:#fff;border:0;padding:14px 24px;color:#4d5557}.tabs button[aria-selected=true]{background:#805a35;color:#fff}.stage{border:1px solid #dee0db;background:white;border-radius:16px;padding:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;border:1px solid #dedfdc;background:white;border-radius:12px;text-align:left;min-height:145px}.card:hover{border-color:#805a35}.card b{display:block;font-size:20px;margin-bottom:10px}.core{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}.core img{max-width:100%;max-height:410px;object-fit:contain}.media{width:100%;height:440px;object-fit:cover;border-radius:10px;display:block}.caption{display:flex;gap:24px;align-items:center;justify-content:space-between}.note{font-size:13px;color:#61696c}.modal-backdrop{position:fixed;inset:0;background:#161a1e66;display:flex;align-items:center;justify-content:center;padding:26px;z-index:10}.modal{position:relative;background:#fff;width:min(1180px,100%);max-height:calc(100vh - 52px);overflow:auto;border-radius:16px;padding:32px;box-shadow:0 24px 70px #171b2438}.close{position:absolute;right:20px;top:18px;background:#fff;border:1px solid #ddd;border-radius:50%;width:40px;height:40px;font-size:25px}.modal .body{display:grid;grid-template-columns:1.1fr 1fr;gap:30px}.modal .art{background:#f6f5f1;border-radius:10px;display:flex;align-items:center;justify-content:center;min-height:360px}.modal .art img{width:100%;height:390px;object-fit:contain}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#735332;margin:0 0 12px}.modal h2{padding-right:30px}.modal h2:focus{outline:none}.modal li{margin:14px 0;line-height:1.5}.modal .foot{display:flex;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid #dedfdc;margin-top:24px;padding-top:24px}.modal .foot .note{max-width:60%}[hidden]{display:none!important}.form{max-width:760px;background:#fff;border:1px solid #dedfdc;border-radius:12px;padding:32px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}label{display:block;font-size:14px}input:not([type=checkbox]){width:100%;padding:15px 12px;border:1px solid #bec5c1;border-radius:5px;margin-top:9px}input[aria-invalid=true]{border-color:#b03127}.error{display:block;color:#a33126;font-size:13px;margin-top:7px}.check{display:flex;gap:12px;line-height:1.5;margin:24px 0}.status{padding:15px;background:#f4f2ed;border-radius:6px;margin-top:18px}.status.error-state{background:#fff2ee;color:#923023}.status.success{background:#eff6f0;color:#235f37}.demo-toolbar{border:1px dashed #baa489;padding:16px;background:#faf7f0;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.demo-toolbar button{padding:8px 12px;border:1px solid #ccc;background:#fff;border-radius:5px}.product{display:grid;grid-template-columns:200px 1fr 250px;gap:22px}.product .main-img{width:100%;height:420px;object-fit:contain}.product aside{padding:18px;border:1px solid #dedfdc;border-radius:8px}.product .tabs{margin-top:0}.swatches{display:flex;gap:12px}.swatch{padding:20px;border:1px solid #ddd;flex:1}.sample{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}.focus-sample{outline:3px solid #805a35;outline-offset:4px}.pill{font-size:13px;color:#805a35;background:#faf3e9;border:1px solid #c6a681;border-radius:20px;padding:7px 12px}.dialog-context{position:fixed;inset:0;padding:40px;background:#fafaf8;overflow:hidden}.dialog-context img{width:100%;height:85%;object-fit:contain;opacity:.75}.screenshot header,.screenshot .nav,.screenshot .demo-toolbar{display:none}.screenshot .wrap{padding:42px}.screenshot h1{font-size:38px}.screenshot .modal-backdrop{padding:26px}.screenshot .dialog-context{display:block}body:not(.screenshot) .dialog-context{display:none}@media(max-width:760px){header{padding:16px 20px}.nav,.wrap{padding:24px 20px}h1{font-size:32px}.grid,.core,.fields,.modal .body{grid-template-columns:1fr}.product{grid-template-columns:1fr}.product aside{display:none}.modal-backdrop{padding:8px}.modal{max-height:calc(100dvh - 16px);padding:24px 18px}.modal .art{min-height:220px}.modal .art img{height:240px}.modal .foot{display:block}.modal .foot .note{max-width:100%}.media{height:270px}.caption{display:block}.tabs button{padding:13px}.modal h2{font-size:26px}.screenshot .wrap{padding:24px 20px}.sample{gap:14px}}

</style></head><body><header><img src="../05_LOGOS/TWIN_G_LOCKUP_LIGHT_ALPHA.png" alt="Twin by TALENT"><small>Каталог состояний · Демонстрационные интерфейсы</small></header><nav class="nav" aria-label="Каталог"><a href="?view=composition">Состав и модалки</a><a href="?view=channels">Каналы</a><a href="?view=product">Выбор лота</a><a href="?view=form">Форма</a><a href="?view=controls">Переключатели</a></nav><main class="wrap" id="app"></main><div id="dialog-root"></div><script>
const MODALS=[["client-tools", "Клиентские инструменты", "Помогайте покупателю исследовать проект и выбирать конкретный лот.", "../02_BACKGROUNDS/06_LOT_AXONOMETRIC_CUTAWAY_ALPHA.png", ["Поиск и подбор лотов", "Карточка, сравнение и сохранение", "Пространственное исследование", "Персонализация — по комплектации"], "Инструменты получают контекст из общей цифровой модели."], ["virtual-sales", "Виртуальный отдел продаж", "Связывайте выбор покупателя с предметной работой команды и агентов.", "virtual-sales.svg", ["Рабочее место и контекст клиента", "Подборки и материалы для встречи", "Подготовка персонального предложения", "Обращения и следующие действия"], "Коммерческие сценарии и интеграции согласуются в составе решения."], ["content-system", "Контентная система", "Используйте общую цифровую основу для материалов всех каналов продаж.", "content-system.svg", ["Рендеры и изометрии", "Планировки и карточки лотов", "Панорамы и видео", "Материалы для офиса и digital-каналов"], "Набор материалов и форматы определяются конфигурацией."], ["management", "Управление и аналитика", "Управляйте данными проекта и наблюдайте за интересом к ассортименту.", "management.svg", ["Источники данных проекта", "Ассортимент и статусы", "Обновление информации", "Аналитика поведения и спроса"], "Источники, события и отчёты согласуются отдельно."], ["integrations", "Интеграции", "Соединяйте Twin с CRM и другими системами девелопера.", "integrations.svg", ["Источники ассортимента", "Передача обращения и контекста", "Согласованный обмен данными", "Проверка выбранной конфигурации"], "Поддержка конкретной системы подтверждается при проектировании."], ["commercial", "Коммерческие модули", "Дополняйте выбранное пространство отделкой, мебелью и сервисами.", "../02_BACKGROUNDS/03_SPACE_INTERIOR_SEA_VIEW_BG.png", ["Варианты отделки и комплектации", "Мебель и интерьерные решения", "Подрядчики и связанные сервисы", "Связь с персональным выбором"], "Расширение. Состав и поставщики определяются для проекта."], ["core", "Коммерческий цифровой двойник", "Общая цифровая модель связывает все части системы продаж.", "../02_BACKGROUNDS/04_CORE_ISOMETRIC_PROJECT_ALPHA.png", ["Территория и окружение", "Здания и пространства", "Этажи и лоты", "Виды и интерьеры"], "Ядро продукта. Иллюстративная модель демонстрационного проекта."]];
const P=new URLSearchParams(location.search),view=P.get('view')||'composition',shot=P.has('shot');if(shot)document.body.classList.add('screenshot');const app=document.querySelector('#app'),root=document.querySelector('#dialog-root');let opener=null;
const channels=[['site','Сайт','../08_CHANNEL_MEDIA/01_CHANNEL_WEBSITE.png','Самостоятельное изучение и обращение','Покупатель исследует проект и выбирает конкретный лот.'],['online','Онлайн-показ','../08_CHANNEL_MEDIA/02_CHANNEL_ONLINE_VIEWING.png','Совместный просмотр на расстоянии','Менеджер и покупатель обсуждают проект и выбранные варианты.'],['agent','Агент','../08_CHANNEL_MEDIA/03_CHANNEL_AGENT.png','Единый инструмент для агентского канала','Агент показывает проект и работает с предметным выбором клиента.'],['office','Офис продаж','../02_BACKGROUNDS/05_SALES_OFFICE_CHANNEL_BG.png','Предметный выбор в офисе продаж','Большой экран и общая цифровая основа для обсуждения проекта.']];
function tabs(items,current,fn,label){return `<div class="tabs" role="tablist" aria-label="${label}">${items.map(x=>`<button role="tab" aria-selected="${x[0]===current}" tabindex="${x[0]===current?0:-1}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}
function wireTabs(fn){const all=[...document.querySelectorAll('[data-tab]')];all.forEach((b,i)=>{b.onclick=()=>fn(b.dataset.tab);b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%all.length;if(e.key==='ArrowLeft')n=(i-1+all.length)%all.length;if(e.key==='Home')n=0;if(e.key==='End')n=all.length-1;if(n!==undefined){e.preventDefault();fn(all[n].dataset.tab);document.querySelector(`[data-tab="${all[n].dataset.tab}"]`).focus()}}})}
function composition(){app.innerHTML=`<h1>Из чего состоит Twin</h1><p class="muted">Коммерческий цифровой двойник и связанные компоненты системы продаж</p><div class="core"><img src="../02_BACKGROUNDS/04_CORE_ISOMETRIC_PROJECT_ALPHA.png" alt="Демонстрационная изометрическая модель курортного проекта"><div><p class="eyebrow">Ядро продукта</p><h2>Коммерческий цифровой двойник</h2><p>Общая цифровая модель проекта связывает клиентские, коммерческие и управленческие инструменты.</p><button class="btn secondary" data-open="core">Рассмотреть ядро →</button></div></div><div class="grid">${MODALS.slice(0,6).map(x=>`<button class="card" data-open="${x[0]}"><b>${x[1]} →</b><span class="muted">${x[2]}</span>${x[0]==='commercial'?'<p><span class="pill">Расширение</span></p>':''}</button>`).join('')}</div><p class="note">Конфигурация собирается под задачи проекта. Иллюстрации и UI — демонстрационные.</p>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open,b))}
function openModal(id,button){const m=MODALS.find(x=>x[0]===id);if(!m)return;opener=button||opener;document.body.style.overflow='hidden';app.inert=true;document.querySelector('header').inert=true;document.querySelector('nav').inert=true;root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close" aria-label="Закрыть модалку">×</button><p class="eyebrow">Состав продукта${id==='commercial'?' · Расширение':''}</p><h2 id="modal-title" tabindex="-1">${m[1]}</h2><div class="body"><div class="art"><img src="${m[3]}" alt="Иллюстрация компонента ${m[1]}"></div><div><p style="font-size:20px;line-height:1.5">${m[2]}</p><ul>${m[4].map(s=>`<li>${s}</li>`).join('')}</ul><p class="note">Демонстрационный состав. Конкретные функции определяются конфигурацией.</p></div></div><div class="foot"><p class="note">${m[5]}</p><button class="btn" id="discuss">Обсудить конфигурацию →</button></div></section></div>`;root.querySelector('.close').onclick=closeModal;root.querySelector('#discuss').onclick=()=>location.href='?view=form&topic='+encodeURIComponent(m[1]);root.querySelector('#modal-title').focus();root.onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};document.addEventListener('keydown',trap);}
function trap(e){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const els=[...root.querySelectorAll('button,a,input,[tabindex="0"]')].filter(x=>!x.disabled);if(!els.length)return;const f=els[0],l=els[els.length-1];if(e.shiftKey&&(document.activeElement===f||document.activeElement.id==='modal-title')){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}}
function closeModal(){root.innerHTML='';app.inert=false;document.querySelector('header').inert=false;document.querySelector('nav').inert=false;document.body.style.overflow='';document.removeEventListener('keydown',trap);if(opener)opener.focus();if(view==='modal')location.href='?view=composition'}
function channel(id){const c=channels.find(x=>x[0]===id)||channels[3];app.innerHTML=`<p class="eyebrow">Сценарии применения</p><h1>Один цифровой проект.<br>Вся система продаж.</h1>${tabs(channels,c[0],channel,'Каналы продаж')}<div role="tabpanel" class="stage"><img class="media" src="${c[2]}" alt="${c[1]} — иллюстративная сцена"><div class="caption"><div><h2 style="margin-top:24px">${c[3]}</h2><p>${c[4]}</p></div><button class="btn" onclick="location.href='?view=form&topic=${c[0]}'">Обсудить сценарий →</button></div><p class="note">Демонстрационная сцена. Состав сценария согласуется для проекта.</p></div>`;wireTabs(channel)}
function product(mode='plan'){app.innerHTML=`<p class="eyebrow">Демонстрационный интерфейс</p><h1>Исследуйте проект.<br>Рассмотрите конкретный лот.</h1><p class="muted">Проект › Корпус 1 › Этаж 4 › Лот 4.2</p><div class="stage product"><aside><b>Выбранный контекст</b><p>Корпус 1</p><p>Этаж 4</p><p>Лот 4.2</p><p class="note">Один демолот. Остальные данные не подключены.</p></aside><div>${tabs([['plan','Планировка'],['view','Вид']],mode,product,'Материал лота')}<img class="main-img" style="${mode==='view'?'object-fit:cover;border-radius:8px':''}" src="../02_BACKGROUNDS/${mode==='plan'?'06_LOT_AXONOMETRIC_CUTAWAY_ALPHA.png':'03_SPACE_INTERIOR_SEA_VIEW_BG.png'}" alt="${mode==='plan'?'Объёмная планировка':'Иллюстративный вид и пространство'}"></div><aside><b>Выбранный лот</b><p>Корпус 1 · Этаж 4</p><p>Лот 4.2</p><p class="note">Иллюстрация. Планировка и вид не являются документацией реального объекта.</p><button class="btn secondary" onclick="location.href='?view=form&topic=Лот%204.2'">Обсудить лот</button></aside></div>`;wireTabs(product)}
const states=['idle','invalid','loading','error','success'];
function form(state='idle'){app.innerHTML=`<p class="eyebrow">Запрос демонстрации</p><h1>Посмотрите, как Twin может<br>работать на вашем проекте.</h1><div class="demo-toolbar" aria-label="Симулятор состояний">${states.map(s=>`<button data-state="${s}">${s}</button>`).join('')}<span class="note">Симулятор: сеть и отправка не подключены.</span></div><form class="form" novalidate><div class="fields">${[['name','Имя'],['company','Компания'],['contact','Телефон или email'],['project','Ссылка на проект — необязательно']].map(([id,label])=>`<label for="${id}">${label}<input id="${id}" name="${id}" ${id!=='project'?'required':''} ${state==='invalid'&&id==='contact'?'aria-invalid="true" aria-describedby="contact-error"':''} value="${['loading','error','success'].includes(state)?({'name':'Демо-пользователь','company':'Демо-компания','contact':'demo@example.test','project':''})[id]:''}">${state==='invalid'&&id==='contact'?'<span class="error" id="contact-error">Укажите телефон или email.</span>':''}</label>`).join('')}</div>${P.get('topic')?'<p class="note" id="topic"></p>':''}<label class="check"><input type="checkbox" name="consent" ${['loading','error','success'].includes(state)?'checked':''}> <span>Согласие на обработку данных. Политика подключается перед публикацией.</span></label><button class="btn" type="submit" ${state==='loading'?'disabled':''}>${state==='loading'?'Отправляем…':state==='error'?'Повторить отправку':'Запросить демонстрацию'}</button><div role="status" class="status ${state==='error'?'error-state':state==='success'?'success':''}">${state==='error'?'Не удалось отправить. Данные сохранены, попробуйте ещё раз.':state==='success'?'Демонстрация успешного ответа. Реальные данные не отправлены.':state==='loading'?'Демонстрационное состояние загрузки.':state==='invalid'?'Проверьте контакт и согласие.':'Демонстрационная форма: данные не отправляются.'}</div></form>`;if(document.querySelector('#topic'))document.querySelector('#topic').textContent='Тема: '+P.get('topic');document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>form(b.dataset.state));document.querySelector('form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(!f.contact.value.trim()||!f.consent.checked){const values=Object.fromEntries(new FormData(f).entries());form('invalid');for(const [k,v] of Object.entries(values)){const el=document.querySelector('[name="'+k+'"]');if(el&&el.type!=='checkbox')el.value=v;else if(el)el.checked=true}document.querySelector('#contact').focus()}else{document.querySelector('[role=status]').textContent='Демонстрационная форма: данные не отправлены.'}}}
function controls(){app.innerHTML=`<p class="eyebrow">Компоненты · состояния</p><h1>Переключатели и действия Twin</h1><div class="stage"><h2>Вкладки</h2>${tabs([['a','Клиентские инструменты'],['b','Контент и материалы'],['c','Работа команды']],'a',()=>{},'Пример вкладок')}<h2>Кнопки</h2><div class="sample"><button class="btn">Посмотреть Twin →</button><button class="btn secondary">Обсудить проект</button><button class="btn focus-sample">Фокус клавиатуры</button><button class="btn" disabled>Недоступно</button></div><h2>Материалы лота</h2>${tabs([['plan','Планировка'],['view','Вид из окна']],'view',()=>{},'Материалы')}<h2>Маркеры и закрытие</h2><div class="sample"><span class="pill">Расширение</span><span class="pill">Демонстрационный интерфейс</span><button class="btn secondary" aria-label="Закрыть">×</button><button class="btn secondary">К карте компонентов ←</button></div><h2>Поля</h2><div class="fields"><label>Обычное<input placeholder="Компания"></label><label>Ошибка<input aria-invalid="true" aria-describedby="sample-error"><span class="error" id="sample-error">Заполните контакт.</span></label></div><p class="note">Эти примеры показывают визуальные состояния. Настоящие вкладки доступны в разделах каталога.</p></div>`}
if(view==='modal'){composition();openModal(P.get('id')||'client-tools');}else if(view==='channels')channel(P.get('id')||'office');else if(view==='product')product(P.get('id')||'plan');else if(view==='form')form(P.get('id')||'idle');else if(view==='controls')controls();else composition();
window.uiReady=(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r})));return true})();
</script></body></html>
