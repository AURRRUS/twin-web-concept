name: VIS-002 QA
on:
  push:
    branches: ['work/twin-v2-*', 'work/twin-v2/**']
    paths: ['src/**', 'public/**', '.twin/v2/**', '.twin/tasks/**', 'scripts/**', 'tests/**', 'package*.json', 'astro.config.mjs', '.github/workflows/v2-vis002-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test tests/visual-gate-v2.test.mjs
      - run: npm ci
      - run: |
          if command -v google-chrome >/dev/null; then QA_CHROMIUM=$(command -v google-chrome); else npx playwright install --with-deps chromium; QA_CHROMIUM=$(node --input-type=module -e "import{chromium}from'@playwright/test';console.log(chromium.executablePath())"); fi
          sudo ln -sf "$QA_CHROMIUM" /usr/bin/chromium
      - run: npm run twin:task -- VIS-003 && npm run typecheck && npm run twin:test && npm run twin:check && npm run build:v2
      - run: |
          mkdir -p /tmp/twin-v2-preview
          ln -s "$PWD/dist" /tmp/twin-v2-preview/twin-web-concept
          python3 -m http.server 4361 --bind 127.0.0.1 --directory /tmp/twin-v2-preview > /tmp/v2-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4361/twin-web-concept/v2/ >/dev/null && break; sleep 1; done
          V2_QA_SCOPE="${{ contains(github.event.head_commit.message, '[contact-qa]') && 'contact' || '' }}" node scripts/verify-v2.mjs
          V2_URL=http://127.0.0.1:4361/twin-web-concept/v2/ node scripts/verify-v2-extra.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vis-002-qa
          path: |
            artifacts/vis-002
            /tmp/vis002-extra
