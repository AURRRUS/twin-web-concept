name: Twin V2 working preview
on:
  push:
    branches: [work/workflow-foundation-20261029]
    paths:
      - '.github/workflows/v2-working-preview.yml'
      - 'src/**'
      - 'public/**'
      - '.twin/state.json'
      - '.twin/v2/**'
      - '.twin/tasks/**'
      - 'scripts/**'
      - 'tests/workflow*.test.mjs'
      - 'tests/visual-gate-v2.test.mjs'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: twin-v2-working-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/work/workflow-foundation-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TWIN_V2_MANIFEST_FILE: /tmp/twin-v2-preview-non-v2-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .agents
            .github
            .twin
            docs
            public
            scripts
            src
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read scoped preview authorization
        id: authority
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {candidate,publicationErrors} from './scripts/workflow-state.mjs';
          const {state,task,run}=candidate(process.cwd());
          const allowed=state.siteCandidate.profile==='v2' && state.workingBranch===process.env.GITHUB_REF_NAME &&
            state.siteCandidate.sourceBranch===process.env.GITHUB_REF_NAME &&
            publicationErrors(state,task,run,'preview',process.cwd()).length===0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`allowed=${allowed}\n`);
          console.log(allowed ? 'Current task authorizes a working preview; final acceptance stays separate' : 'No current preview authorization: skipping site publication');
          NODE
      - name: Check current evidence and publication guards
        if: steps.authority.outputs.allowed == 'true'
        run: |
          node scripts/workflow-check.mjs
          node --test tests/workflow*.test.mjs tests/visual-gate-v2.test.mjs scripts/workflow-state.preview.test.mjs scripts/opening-journey-frame.test.mjs
          node scripts/verify-opening-invariants.mjs
          node scripts/visual-gate-v2.mjs --release-kind=preview
      - name: Install and build the same V2
        if: steps.authority.outputs.allowed == 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build:v2
      - name: Publish only the V2 subtree
        if: steps.authority.outputs.allowed == 'true'
        run: |
          curl --fail --silent --show-error https://aurrrus.github.io/twin-web-concept/build-version.json > /tmp/twin-v1-before.json
          curl --fail --silent --show-error https://aurrrus.github.io/twin-web-concept/ > /tmp/twin-v1-before.html
          gh auth setup-git --hostname github.com
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run publish:v2 -- --kind=preview --inspect
          npm run publish:v2 -- --kind=preview | tee /tmp/twin-v2-preview-publish.txt
          gh api --method POST repos/AURRRUS/twin-web-concept/pages/builds || echo 'Explicit Pages build request unavailable; waiting for the normal branch build'
      - name: Verify online source and unchanged V1
        if: steps.authority.outputs.allowed == 'true'
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "https://aurrrus.github.io/twin-web-concept/v2/build-version.json?source=${GITHUB_SHA}&attempt=${attempt}" > /tmp/twin-v2-preview-marker.json && node --input-type=module -e 'import fs from "node:fs"; const marker=JSON.parse(fs.readFileSync("/tmp/twin-v2-preview-marker.json","utf8")); process.exit(marker.sourceCommit===process.env.GITHUB_SHA ? 0 : 1)'; then break; fi
            if [ "$attempt" -eq 36 ]; then echo 'Published source did not appear at the working URL'; exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error https://aurrrus.github.io/twin-web-concept/v2/ > /tmp/twin-v2-preview-online.html
          curl --fail --silent --show-error https://aurrrus.github.io/twin-web-concept/build-version.json > /tmp/twin-v1-after.json
          curl --fail --silent --show-error https://aurrrus.github.io/twin-web-concept/ > /tmp/twin-v1-after.html
          cmp /tmp/twin-v1-before.json /tmp/twin-v1-after.json
          cmp /tmp/twin-v1-before.html /tmp/twin-v1-after.html
      - uses: actions/upload-artifact@v4
        if: always() && steps.authority.outputs.allowed == 'true'
        with:
          name: twin-v2-working-preview-${{ github.sha }}
          path: |
            /tmp/twin-v2-preview-non-v2-manifest.json
            /tmp/twin-v2-preview-publish.txt
            /tmp/twin-v2-preview-marker.json
            /tmp/twin-v1-before.json
            /tmp/twin-v1-after.json
