name: Verify published Twin preview
on:
  push:
    branches: [codex/twin-desktop-v1-3]
    paths-ignore:
      - 'docs/**'
      - 'artifacts/**'
      - '**/*.md'
permissions:
  contents: write
concurrency:
  group: twin-preview-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify the deployed commit and public browser interactions
        id: verify
        env:
          TWIN_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-online.mjs
      - name: Preserve observed online verification
        if: always()
        run: |
          if [ -f artifacts/online-verification.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add artifacts/online-verification.json
            if [ -f artifacts/online-first-screen.png ]; then git add artifacts/online-first-screen.png; fi
            if ! git diff --cached --quiet; then
              git commit -m 'ci: record published preview verification [skip ci]'
              git push origin HEAD:codex/twin-desktop-v1-3
            fi
          fi
