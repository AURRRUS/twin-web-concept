<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Motion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}#stage{position:relative;transform-origin:top left}canvas{position:absolute;inset:0}#caption{position:absolute;left:7%;top:7%;font-size:24px;letter-spacing:.1em}#headline{position:absolute;left:7%;top:17%;right:7%;font-size:76px;line-height:1.1;font-weight:600;margin:0}#summary{position:absolute;left:7%;bottom:10%;right:7%;font-size:32px;line-height:1.4}#accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
<div id="stage"><canvas id="film" aria-hidden="true"></canvas><div id="caption"></div><h1 id="headline"></h1><div id="summary"></div><p id="accessible"></p></div>
<script>
window.CFG={
  width:1920,height:1080,fps:60,duration:6,seed:17,
  palette:{background:'#f5f4f0',ink:'#202320',muted:'#777c75',accent:'#55645a',line:'#d4d8d0'},
  fontFamily:'Arial, sans-serif',
  copy:{caption:'ТЕХНИЧЕСКИЙ ПРИМЕР · CODE MOTION',opening:'От данных к решению',closing:'Смысл задаёт движение',summary:'HTML + Canvas 2D · Управляемый таймлайн',nodes:['Данные','Сравнение','Решение']},
  scenes:{opening:{start:0,end:1},main:{start:1,end:4.5},closing:{start:4.5,end:6}},
  motion:{introY:28,exitFade:.5,lineWidth:4},
  qaTimes:[0,.5,1,2.5,4.5,5.5]
};
const stage=document.getElementById('stage'),canvas=document.getElementById('film'),ctx=canvas.getContext('2d');
const caption=document.getElementById('caption'),headline=document.getElementById('headline'),summary=document.getElementById('summary');
const clamp=x=>Math.min(1,Math.max(0,x));
const progress=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
window.Easing={easeInOutCubic:ease,bezier(x,x1=.25,y1=.1,x2=.25,y2=1){
  const cubic=(u,a,b)=>3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*b+u*u*u;
  let lo=0,hi=1;for(let k=0;k<24;k++){const mid=(lo+hi)/2;if(cubic(mid,x1,x2)<x)lo=mid;else hi=mid;}return cubic((lo+hi)/2,y1,y2);
}};
window.render=function(seconds){
  if(!Number.isFinite(seconds))throw new Error('render(t) requires a finite time');
  const c=window.CFG,t=Math.min(c.duration,Math.max(0,seconds)),w=c.width,h=c.height;
  // Set every state from t; backward seeking must not retain a previous frame.
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.background=c.palette.background;stage.style.color=c.palette.ink;stage.style.fontFamily=c.fontFamily;
  stage.style.transform='scale('+Math.min(innerWidth/w,innerHeight/h)+')';
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  ctx.resetTransform();ctx.clearRect(0,0,w,h);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.setLineDash([]);
  const intro=ease(progress(t,c.scenes.opening.start,c.scenes.opening.end));
  const closing=ease(progress(t,c.scenes.closing.start,c.scenes.closing.start+c.motion.exitFade));
  caption.textContent=c.copy.caption;caption.style.color=c.palette.muted;caption.style.opacity=String(intro);
  headline.textContent=closing>=.5?c.copy.closing:c.copy.opening;
  headline.style.opacity=String(intro*(Math.abs(closing-.5)*2));
  headline.style.transform='translateY('+((1-intro)*c.motion.introY)+'px)';
  summary.textContent=c.copy.summary;summary.style.opacity=String(ease(progress(t,c.scenes.closing.start,c.scenes.closing.end)));
  document.getElementById('accessible').textContent=[c.copy.opening,...c.copy.nodes,c.copy.closing].join('. ');
  const p=ease(progress(t,c.scenes.main.start,c.scenes.main.end)),xs=[w*.16,w*.5,w*.84],y=h*.57;
  ctx.lineWidth=c.motion.lineWidth;ctx.strokeStyle=c.palette.line;ctx.beginPath();ctx.moveTo(xs[0],y);ctx.lineTo(xs[2],y);ctx.stroke();
  ctx.strokeStyle=c.palette.accent;ctx.beginPath();ctx.moveTo(xs[0],y);ctx.lineTo(xs[0]+(xs[2]-xs[0])*p,y);ctx.stroke();
  xs.forEach((x,i)=>{const a=ease(clamp(p*3-i));ctx.globalAlpha=.3+.7*a;ctx.fillStyle=a>.5?c.palette.accent:c.palette.line;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=c.palette.ink;ctx.font='28px '+c.fontFamily;ctx.textAlign='center';ctx.fillText(c.copy.nodes[i],x,y+70);});
  ctx.globalAlpha=1;
};
window.ready=(async()=>{await document.fonts.load('600 76px '+window.CFG.fontFamily,window.CFG.copy.opening);await document.fonts.ready;window.render(0);})();
// No autonomous driver. Live integrations call render(t) from an external RAF/scroll driver.
</script></html>
